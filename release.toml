# vl-release repository contract: https://github.com/valkyrianlabs/vl-release
# Release with `vlr cut patch|minor|major --push`; .github/workflows/release.yml does the rest.
schema_version = 1

[tool]
requires = ">=0.3,<1"

[project]
name = "Payload Markdown"
package = "payload-markdown"
repository = "valkyrianlabs/payload-markdown"

[version]
canonical = { kind = "package_json", path = "package.json" }
targets = [
  { kind = "regex", path = "src/version.ts", pattern = "PAYLOAD_MARKDOWN_VERSION = '(?P<version>[^']+)'" },
  { kind = "regex", path = "skills/payload-markdown/claude/skill.json", pattern = '"version": "(?P<version>[^"]+)"' },
  { kind = "regex", path = "skills/payload-markdown/codex/skill.json", pattern = '"version": "(?P<version>[^"]+)"' },
]

[release]
branch = "main"
title = "v{version} - {title}"
test_command = ["pnpm", "test:int"]

# The published package: bin/, dist/ and skills/ plus README, LICENSE and package.json.
# Published as @valkyrianlabs/payload-markdown and, from the same tarball, as payload-markdown.
[npm]
pre_pack = [["pnpm", "build"]]
required_paths = [
  "package/package.json",
  "package/README.md",
  "package/LICENSE",
  "package/bin/payload-markdown.mjs",
  "package/bin/skill.mjs",
  "package/dist/index.js",
  "package/dist/index.d.ts",
  "package/dist/exports/server.js",
  "package/dist/exports/client.js",
  "package/dist/exports/render.js",
  "package/dist/exports/advanced.js",
  "package/dist/exports/mcp.js",
  "package/dist/directive-spec.json",
  "package/dist/package.js",
  "package/dist/components/MarkdownRenderer/index.css",
  "package/skills/payload-markdown/claude/SKILL.md",
  "package/skills/payload-markdown/codex/SKILL.md",
  "package/skills/payload-markdown/claude/skill.json",
  "package/skills/payload-markdown/codex/skill.json",
]
forbidden_paths = [
  "package/src/*",
  "package/dev/*",
  "package/docs/*",
  "package/tests/*",
  "package/node_modules/*",
  "package/.env*",
  "package/*.tsbuildinfo",
]
identical_files = [
  { member = "package/README.md", source = "README.md" },
  { member = "package/LICENSE", source = "LICENSE" },
  { member = "package/skills/payload-markdown/claude/SKILL.md", source = "skills/payload-markdown/claude/SKILL.md" },
  { member = "package/skills/payload-markdown/codex/SKILL.md", source = "skills/payload-markdown/codex/SKILL.md" },
  { member = "package/skills/payload-markdown/claude/skill.json", source = "skills/payload-markdown/claude/skill.json" },
  { member = "package/skills/payload-markdown/codex/skill.json", source = "skills/payload-markdown/codex/skill.json" },
]

# The unscoped name: vlr derives payload-markdown-X.Y.Z.tgz from the canonical tarball. Only
# package.json "name" and dist/package.js (PAYLOAD_MARKDOWN_PACKAGE, which Payload admin
# component paths use) differ; validate-artifacts fails on any other difference.
[[npm.aliases]]
name = "payload-markdown"
rewrite = ["package/dist/package.js", "package/dist/package.js.map"]

# npmjs.com through npm trusted publishing: the package trusts this repository's
# .github/workflows/release.yml (environment Production); no token secret.
[[publish.npm]]
name = "npmjs"
registry = "https://registry.npmjs.org/"
auth = "oidc"
