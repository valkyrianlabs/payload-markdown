# Release payload-markdown with vl-release.
#
#   vlr cut patch|minor|major --push      (locally) -> pushes vX.Y.Z -> this workflow
#
# build ─▶ publish (npm + docs) ─▶ github-release ─▶ finalize
#
# `vlr prepare` promotes .release/RELEASE_NOTES_NEXT.md into RELEASE_NOTES.md in each job's work
# tree only (it is deterministic, so every job renders the same documents). The npm tarball is
# packed and validated once in the build job; later jobs publish and attach those exact bytes.
# Nothing is written back to main unless npm publication, the docs sync and the GitHub release
# all succeeded.
#
# npm: trusted publishing (OIDC). The npmjs.com package trusts this workflow file
# (`release.yml`) and the `Production` environment; keep both names. No token secret.
# Optional: vars.RELEASE_PUBLISH_MODE (`enabled` by default here, `disabled` to rehearse).

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag (e.g. v1.7.0)
        required: true
        type: string
      publish:
        description: Publish, or rehearse everything without publishing
        required: true
        default: dry-run
        type: choice
        options: [dry-run, publish]

permissions:
  contents: read

concurrency:
  group: npm-production
  cancel-in-progress: false

env:
  RELEASE_REF: ${{ github.event.inputs.ref || github.ref }}
  DOCS_SYNC_ENDPOINT: https://valkyrianlabs.com/api/documentation/sync
  PMDOCS_SOURCE: payload-markdown

jobs:
  build:
    name: Prepare, build and validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # pmdocs dry-run sync
    outputs:
      version: ${{ steps.state.outputs.version }}
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install vl-release and pmdocs
        run: bash .github/scripts/install-valkyrianlabs-tools.sh vl-release pmdocs

      - name: Publication mode
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event.inputs.publish }}" = "publish" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release gate
        run: vlr check --release --tag "${RELEASE_REF#refs/tags/}"

      - name: Prepare release documents (work tree only)
        run: vlr prepare --record release/meta/prepare.json

      - name: Release state
        id: state
        run: vlr status --github-output

      - name: Install dependencies
        run: |
          set -euo pipefail
          corepack enable
          pnpm install --frozen-lockfile --prefer-offline

      # Runs `pnpm build` (pre_pack) and packs the tarball that every later step uses.
      - name: Build and pack
        run: |
          set -euo pipefail
          export NEXT_CPU_COUNT="$(nproc)"
          vlr build-npm

      # After the build: several contract tests exercise the built dist.
      - name: Run tests
        run: pnpm test:int

      - name: Lint
        run: pnpm lint

      - name: Typecheck dev app
        run: pnpm exec tsc -p dev/tsconfig.json --noEmit

      - name: Plain-Node export smoke
        run: pnpm test:exports

      - name: Validate docs and rehearse the docs sync
        run: |
          set -euo pipefail
          pmdocs validate ./docs --source "$PMDOCS_SOURCE"
          pmdocs push ./docs \
            --endpoint "$DOCS_SYNC_ENDPOINT" \
            --source "$PMDOCS_SOURCE" \
            --github-oidc \
            --dry-run

      - name: Checksums and package contract
        run: |
          set -euo pipefail
          vlr checksums
          vlr validate-artifacts
          vlr artifacts

      # Read-only: fails now if this version is already on npm with different bytes.
      - name: Plan npm publication
        run: vlr publish-npm --mode enabled --dry-run

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: payload-markdown-${{ steps.state.outputs.version }}
          path: release
          if-no-files-found: error

  publish:
    name: Publish to npm and sync docs
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.outputs.publish == 'true'
    environment:
      name: Production
      url: https://www.npmjs.com/package/@valkyrianlabs/payload-markdown
    permissions:
      contents: read
      id-token: write # npm trusted publishing + pmdocs
    env:
      RELEASE_PUBLISH_MODE: ${{ vars.RELEASE_PUBLISH_MODE || 'enabled' }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'

      - name: Install vl-release and pmdocs
        run: bash .github/scripts/install-valkyrianlabs-tools.sh vl-release pmdocs

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: payload-markdown-${{ needs.build.outputs.version }}
          path: release

      # Publishes the validated tarball (or skips it if npm already has identical bytes), then
      # waits until npm lists it by integrity under `latest`.
      - name: Publish to npm
        run: |
          set -euo pipefail
          vlr prepare
          vlr publish-npm --require-enabled

      - name: Publish docs to docs.valkyrianlabs.com
        run: |
          set -euo pipefail
          pmdocs push ./docs \
            --endpoint "$DOCS_SYNC_ENDPOINT" \
            --source "$PMDOCS_SOURCE" \
            --github-oidc \
            --publish

  github-release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [build, publish]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Install vl-release
        run: bash .github/scripts/install-valkyrianlabs-tools.sh vl-release

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: payload-markdown-${{ needs.build.outputs.version }}
          path: release

      - name: Create or update the release (notes from RELEASE_NOTES.md; assets immutable)
        run: |
          set -euo pipefail
          vlr prepare
          vlr github-release

  finalize:
    name: Record the release on main
    runs-on: ubuntu-latest
    needs: [build, publish, github-release]
    permissions:
      contents: write
    steps:
      - name: Checkout the release tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ env.RELEASE_REF }}
          fetch-depth: 0

      - name: Install vl-release
        run: bash .github/scripts/install-valkyrianlabs-tools.sh vl-release

      - name: Download release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: payload-markdown-${{ needs.build.outputs.version }}
          path: release

      # Re-prepare (deterministic), prove it matches what was built and published, then commit
      # RELEASE_NOTES.md and the cleared staging file onto main.
      - name: Finalize
        run: |
          set -euo pipefail
          vlr prepare
          vlr finalize --record release/meta/prepare.json
