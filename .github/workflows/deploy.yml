name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Every build, test and browser step runs inside the disposable CI container (`./ci/run-ci`,
# rootless Podman; see ci/README.md), so neither job needs host sudo, host packages or Docker.
#
# Runners: pushes and pull requests from branches of this repository run on the self-hosted
# runner; pull requests from forks (untrusted code that could also rewrite this file) run on
# GitHub-hosted runners, which build the same container.
#
# This workflow is the package contract: every gate below must stay green for a change to land
# (lint, build, dev-app typecheck, unit/integration tests, plain-Node imports of the published
# subpaths, both npm package names, type resolution of the packed tarball, and the Playwright
# suite against Postgres).
jobs:
  build-and-test:
    name: Build, lint, typecheck, test
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","ubuntu-latest-lts"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Reject invalid workflow files (unknown contexts, bad expressions) before they reach main;
      # GitHub otherwise reports them only as a failed run with no jobs.
      - name: Lint workflows
        run: ./ci/run-ci bash -c 'bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7 && ./actionlint -color -shellcheck='

      - name: Install dependencies
        run: ./ci/run-ci pnpm install --frozen-lockfile --prefer-offline

      - name: Lint
        run: ./ci/run-ci pnpm lint

      - name: Build
        run: ./ci/run-ci bash -c 'NEXT_CPU_COUNT=$(nproc) pnpm build'

      - name: Typecheck dev app
        run: ./ci/run-ci pnpm exec tsc -p dev/tsconfig.json --noEmit

      # Runs after the build so the dist-backed checks (plain-Node exports,
      # generated directive spec, built/source settings sharing) are not skipped.
      - name: Run tests
        run: ./ci/run-ci pnpm test:int

      # Imports ".", "./render", "./advanced" and "./mcp" in plain Node through the package
      # self-reference, walks the ./render and ./mcp module graphs for CSS/React, and resolves
      # the bundler-only "./server", "./client", "./styles.css" and "./directive-spec.json".
      - name: Plain-Node export smoke
        run: ./ci/run-ci pnpm test:exports

      # Rehearses the dual npm publication: packs dist/, derives the unscoped
      # payload-markdown tarball like vlr does, and checks both names (same
      # files, every export, types and the bin).
      - name: Verify both npm packages
        run: ./ci/run-ci pnpm verify:packages

      - name: Check published types (arethetypeswrong)
        run: ./ci/run-ci pnpm dlx @arethetypeswrong/cli@0.18.5 --pack --profile esm-only

  e2e:
    name: Playwright e2e
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'ubuntu-latest' || fromJSON('["self-hosted","Linux","X64","ubuntu-latest-lts"]') }}
    env:
      PAYLOAD_SECRET: ci-secret
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        run: ./ci/run-ci pnpm install --frozen-lockfile --prefer-offline

      # The dev app's import map loads the package through its own exports
      # (dist), so the package is built before the dev server starts.
      - name: Build
        run: ./ci/run-ci pnpm build

      # Chromium and its OS dependencies come with the container image; the run gets its own
      # throwaway Postgres (tmpfs) in the same pod.
      - name: Run Playwright
        run: ./ci/run-playwright

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ github.run_attempt }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
